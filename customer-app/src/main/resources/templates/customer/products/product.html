<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Правильный title - используем название продукта -->
    <title th:text="${product != null ? product.title + ' – Сельмаг' : 'Product Not Found'}">Название продукта – Сельмаг</title>
    <!-- Стили можно добавить сюда или использовать layout, если он есть -->
    <style>
        body { font-family: sans-serif; margin: 20px; }
        label { margin-right: 10px; }
        textarea { width: 300px; height: 80px; margin-top: 5px; }
        .navigation-links a { margin-right: 15px; text-decoration: none; color: blue; }
        .navigation-links a:hover { text-decoration: underline; }
        .reviews-section div { border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
        .error-list { color: #dc3545; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .error-list h3 { margin-top: 0; color: #721c24; }
        .error-list ul { margin-bottom: 0; padding-left: 20px; }
        button { padding: 8px 15px; margin-top: 10px; cursor: pointer; border-radius: 4px; border: 1px solid transparent; }
        button[type="submit"] { background-color: #28a745; color: white; border-color: #28a745; }
        button[type="submit"]:hover { background-color: #218838; border-color: #1e7e34; }
        /* Стили для кнопок избранного */
        form[data-th-if] { display: inline-block; margin-right: 10px; }
        form[data-th-if='${!inFavourite}'] button { background-color: #007bff; color: white; border-color: #007bff;}
        form[data-th-if='${!inFavourite}'] button:hover { background-color: #0056b3; border-color: #0056b3;}
        form[data-th-if='${inFavourite}'] button { background-color: #dc3545; color: white; border-color: #dc3545;}
        form[data-th-if='${inFavourite}'] button:hover { background-color: #c82333; border-color: #bd2130;}
    </style>
</head>
<body>

<!-- Блок навигационных ссылок -->
<div class="navigation-links">
    <a data-th-href="@{/customer/products/list}">← К списку товаров</a>
    <a data-th-href="@{/recommendations/list}">Рекомендации и Статистика</a>
</div>
<hr>

<!-- Отображение данных продукта (только если продукт найден) -->
<div th:if="${product != null}">
    <h1 data-th-text="${product.title}">Название продукта</h1>
    <p data-th-text="${product.details}">Описание продукта.</p>

    <!-- Формы для избранного -->
    <form method="post" data-th-action="@{/customer/products/{productId}/add-to-favourites(productId=${product.id})}"
          data-th-if="${!inFavourite}">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <button type="submit">Добавить в избранное</button>
    </form>
    <form method="post" data-th-action="@{/customer/products/{productId}/remove-from-favourites(productId=${product.id})}"
          data-th-if="${inFavourite}">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <button type="submit">Удалить из избранного</button>
    </form>

    <hr style="margin-top: 20px;"> <!-- Разделитель перед отзывами -->

    <h2>Отзывы</h2>

    <!-- Отображение ошибок валидации отзыва -->
    <div data-th-if="${errors}" class="error-list">
        <h3>Ошибка при добавлении отзыва:</h3>
        <ul>
            <li data-th-each="error : ${errors}" data-th-text="${error}">Текст ошибки</li>
        </ul>
    </div>

    <!-- Форма добавления отзыва -->
    <form method="post" data-th-action="@{/customer/products/{productId}/create-review(productId=${product.id})}">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <div>
            <strong>Оценка:</strong><br>
            <label><input type="radio" name="rating" value="1" th:checked="${payload?.rating == 1}"> 1</label>
            <label><input type="radio" name="rating" value="2" th:checked="${payload?.rating == 2}"> 2</label>
            <label><input type="radio" name="rating" value="3" th:checked="${payload?.rating == 3}"> 3</label>
            <label><input type="radio" name="rating" value="4" th:checked="${payload?.rating == 4}"> 4</label>
            <label><input type="radio" name="rating" value="5" th:checked="${payload?.rating == 5}" required> 5</label> <!-- Добавил required для примера -->
        </div>
        <br>
        <div>
            <label for="reviewText"><strong>Отзыв:</strong></label><br>
            <textarea id="reviewText" name="review" data-th-text="${payload?.review}" placeholder="Напишите ваш отзыв..." required minlength="3"></textarea> <!-- Добавил required и minlength для примера -->
        </div><br>
        <button type="submit">Отправить отзыв</button>
    </form>

    <!-- Список существующих отзывов -->
    <div class="reviews-section">
        <h3>Существующие отзывы:</h3>
        <div data-th-if="${#lists.isEmpty(reviews)}">
            <p>Отзывов пока нет.</p>
        </div>
        <div data-th-each="review : ${reviews}">
            <h4>Оценка: <span th:text="${review.rating}">5</span>*</h4>
            <p data-th-text="${review.review}">Текст отзыва...</p>
        </div>
    </div>
</div>

<!-- Сообщение, если продукт не найден (хотя у вас есть Error Handler) -->
<div th:if="${product == null}">
    <h1>Товар не найден</h1>
    <p>К сожалению, товар с таким ID не найден.</p>
    <div class="mt-3">
        <a th:href="@{/customer/products/list}" class="btn btn-secondary">К списку товаров</a>
    </div>
</div>


</body>
</html>
